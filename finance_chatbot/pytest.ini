# pytest.ini
# ===========================================================================
# PyTest configuration for the finance_chatbot test suite.
#
# asyncio_mode = "auto"
#   Automatically treats every async test function as an anyio test without
#   requiring the @pytest.mark.anyio decorator on each function individually.
#
# testpaths
#   Only look for tests inside the tests/ directory.
#
# addopts
#   -v             : verbose output (show each test name)
#   --tb=short     : compact traceback format
#   --cov          : collect coverage for the finance_agent package
#   --cov-report   : output coverage as terminal + HTML
# ===========================================================================
[pytest]
asyncio_mode = auto
testpaths = tests
addopts =
    -v
    --tb=short
    --cov=finance_agent
    --cov=main
    --cov-report=term-missing
    --cov-report=html:coverage_html
